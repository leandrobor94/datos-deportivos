name: Recolectar datos del día

on:
  schedule:
    # Horas UTC (Colombia = UTC-5). Minutos raros para evitar la congestión de :00.
    - cron: '7 11 * * *'   # 06:07 Colombia
    - cron: '37 13 * * *'  # 08:37 Colombia, antes de la rutina de fútbol (09:52)
    - cron: '43 15 * * *'  # 10:43 Colombia, antes de béisbol y baloncesto (11:47)
    - cron: '13 20 * * *'  # 15:13 Colombia, alineaciones de la tarde
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recolectar
        run: node recolectar.js
      - name: Guardar en el repo
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') COT"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
